
services:
  iris:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    command: --check-caps false
    ports: 
      - 1972
      - 62773:52773
      - 63773
    volumes:
      - ./:/irisdev/app
  react:
    build:
      context: ./frontend/CCD-TOOLS-Frontend
      dockerfile: ${DOCKERFILE:-Dockerfile.amd64}
    restart: always
    ports:
      - 4000:3000
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000